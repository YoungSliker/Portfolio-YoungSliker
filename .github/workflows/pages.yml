name: Build compressed portfolio for Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified build to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: portfolio-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: New/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
        working-directory: New
      - run: npm run build
        working-directory: New
      - run: python New/python/compat-videos.py
      - run: python New/python/package-pages.py
      - run: python New/python/verify-pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: New/release/site
  deploy:
    if: github.event_name == 'push' || inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
