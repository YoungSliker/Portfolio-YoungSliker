<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      history.scrollRestoration = 'manual';
      const navigation = performance.getEntriesByType('navigation')[0];
      if (navigation?.type === 'reload' && !location.hash.startsWith('#work=')) {
        history.replaceState(history.state, '', location.pathname + location.search);
      }
      if (!location.hash) window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF9F6" />
    <meta name="description" content="YoungSliker 的创作档案：探索人工智能、数字体验与视觉传播的边界。" />
    <title>YoungSliker — 创作档案 / Portfolio 2.0</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/js/app/main.tsx"></script>
  </body>
</html>
